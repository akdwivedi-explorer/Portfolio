apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Note: Replace this with your actual image
          image: ashutoshdwivedi01/portfolio-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # In a real environment, this might point to an Ingress URL rather than internal ClusterIP
            - name: NEXT_PUBLIC_BACKEND_URL
              value: "http://backend:8080/api/v1"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer # Change to ClusterIP if using an Ingress controller
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: frontend
